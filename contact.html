<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Pavel Panioukin</title>
  <meta name="description" content="Get in touch with Pavel Panioukin.">
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="contact-section container">
      <div class="contact-left appear">
        <h1 class="contact-headline" id="contact-headline">Let's build something great together.</h1>
        <p class="contact-subtext" id="contact-subtext">I'm always interested in new projects, opportunities to collaborate, and conversations about design. Drop me a line — I read every message.</p>
        <a class="contact-email" id="contact-email" href="mailto:hello@panioukin.design">hello@panioukin.design</a>
      </div>

      <div class="contact-right appear">
        <form class="contact-form" id="contact-form" onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label class="form-label" for="name">Name</label>
            <input class="form-input" type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="message">Message</label>
            <textarea class="form-textarea" id="message" name="message" placeholder="Tell me about your project..." required></textarea>
          </div>
          <button class="btn-submit" type="submit">Send Message →</button>
          <p id="form-note" style="margin-top:12px;font-size:.875rem;color:var(--text-muted)"></p>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="site.js"></script>
  <script src="animations.js"></script>
  <script src="js/transitions.js"></script>
  <script>
    async function init() {
      const data = await fetch('data.json?v=' + Date.now()).then(r => r.json());
      renderFooterData(data);

      const contact = data.contact || {};
      if (contact.headline) setText('contact-headline', contact.headline);
      if (contact.subtext) setText('contact-subtext', contact.subtext);
      if (contact.email) {
        const emailEl = document.getElementById('contact-email');
        emailEl.href = `mailto:${contact.email}`;
        emailEl.textContent = contact.email;
      }
    }

    function handleSubmit(e) {
      e.preventDefault();
      const note = document.getElementById('form-note');

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;

      const subject = encodeURIComponent(`Portfolio inquiry from ${name}`);
      const body = encodeURIComponent(`From: ${name} <${email}>\n\n${message}`);

      window.location.href = `mailto:hello@panioukin.design?subject=${subject}&body=${body}`;

      note.textContent = 'Opening your email client…';
    }

    init();
  </script>
</body>
</html>
