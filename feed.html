<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed — Pavel Panioukin</title>
  <meta name="description" content="An archive of visual work by Pavel Panioukin.">
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="page-header container appear" style="border-bottom:none">
      <h1 class="page-title">Process work and visual thinking — the part of design that never makes it into the case study.</h1>
    </div>

    <div class="bento-section container appear">
      <div class="bento-grid" id="bento-grid">
        <div class="bento-col" id="bento-col-0"></div>
        <div class="bento-col" id="bento-col-1"></div>
        <div class="bento-col" id="bento-col-2"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Fullscreen image lightbox -->
  <div id="feed-lightbox" onclick="closeLightbox()">
    <img id="feed-lightbox-img" src="" alt="">
  </div>

  <script src="site.js"></script>
  <script src="animations.js"></script>
  <script src="js/transitions.js"></script>
  <script src="/js/cursor.js"></script>
</body>
</html>
