<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed — Pavel Panioukin</title>
  <meta name="description" content="An archive of visual work by Pavel Panioukin.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="site-header"></header>

  <main>
    <div class="page-header container">
      <h1 class="page-title">An archive of everything — early sketches to finished products. All shared here.</h1>
    </div>

    <div class="bento-section container">
      <div class="bento-grid" id="bento-grid"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="site.js"></script>
  <script>
    async function init() {
      const data = await fetch('data.json').then(r => r.json());
      renderFooterData(data);
      renderBento(data.artifacts || []);
    }

    function renderBento(artifacts) {
      const grid = document.getElementById('bento-grid');
      if (!artifacts.length) {
        grid.innerHTML = '<p class="bento-empty">No artifacts yet.</p>';
        return;
      }
      const dlIcon = `<svg viewBox="0 0 24 24"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0018 9h-1.26A8 8 0 103 16.29"/></svg>`;
      grid.innerHTML = artifacts.map(a => `
        <div class="bento-item${a.size === 'large' ? ' large' : ''}">
          <img src="${escHtml(a.url)}" alt="${escHtml(a.alt || '')}" loading="lazy">
          <div class="bento-overlay">
            <a class="bento-download" href="${escHtml(a.url)}" download title="Download">${dlIcon}</a>
          </div>
        </div>`).join('');
    }

    init();
  </script>
</body>
</html>
