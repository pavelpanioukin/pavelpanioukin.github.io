<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed — Pavel Panioukin</title>
  <meta name="description" content="An archive of visual work by Pavel Panioukin.">
  <meta property="og:title" content="Feed — Pavel Panioukin">
  <meta property="og:description" content="An archive of visual work by Pavel Panioukin.">
  <meta property="og:image" content="/assets/images/og-image.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="page-header container" style="border-bottom:none">
      <h1 class="page-title">An archive of everything — early sketches to finished products. All shared here.</h1>
    </div>

    <div class="bento-section container">
      <div class="bento-grid" id="bento-grid">
        <div class="bento-col" id="bento-col-0"></div>
        <div class="bento-col" id="bento-col-1"></div>
        <div class="bento-col" id="bento-col-2"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Fullscreen image lightbox -->
  <div id="feed-lightbox" onclick="closeLightbox()">
    <img id="feed-lightbox-img" src="" alt="">
  </div>

  <script src="site.js"></script>
  <script src="animations.js"></script>
  <script>
    async function init() {
      const data = await fetch('data.json?v=' + Date.now()).then(r => r.json());
      renderFooterData(data);
      renderBento(data.feed || []);
    }

    function renderBento(feed) {
      const grid = document.getElementById('bento-grid');
      if (!feed.length) {
        grid.innerHTML = '<p class="bento-empty">Nothing here yet.</p>';
        return;
      }
      const cols = [
        document.getElementById('bento-col-0'),
        document.getElementById('bento-col-1'),
        document.getElementById('bento-col-2')
      ];
      feed.forEach((a, i) => {
        const div = document.createElement('div');
        div.className = 'bento-item';
        div.style.setProperty('--delay', i * 30 + 'ms');
        div.onclick = () => openLightbox(a.url, a.alt || '');
        const img = document.createElement('img');
        img.src = a.url;
        img.alt = a.alt || '';
        div.appendChild(img);
        cols[i % 3].appendChild(div);
      });
    }

    function openLightbox(src, alt) {
      const lb = document.getElementById('feed-lightbox');
      const img = document.getElementById('feed-lightbox-img');
      img.src = src;
      img.alt = alt;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('feed-lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    init();
  </script>
</body>
</html>
