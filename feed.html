<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed — Pavel Panioukin</title>
  <meta name="description" content="An archive of visual work by Pavel Panioukin.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="page-header container">
      <h1 class="page-title">An archive of everything — early sketches to finished products. All shared here.</h1>
    </div>

    <div class="bento-section container">
      <div class="bento-grid" id="bento-grid"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Fullscreen image lightbox -->
  <div id="feed-lightbox" onclick="closeLightbox()">
    <img id="feed-lightbox-img" src="" alt="">
  </div>

  <script src="site.js"></script>
  <script src="animations.js"></script>
  <script>
    async function init() {
      const data = await fetch('data.json?v=' + Date.now()).then(r => r.json());
      renderFooterData(data);
      renderBento(data.feed || []);
    }

    function renderBento(feed) {
      const grid = document.getElementById('bento-grid');
      if (!feed.length) {
        grid.innerHTML = '<p class="bento-empty">Nothing here yet.</p>';
        return;
      }
      grid.innerHTML = feed.map((a, i) => {
        const spanClass = a.span > 1 ? ` span-${a.span}` : '';
        const ratio = a.aspectRatio || '4/3';
        return `
        <div class="bento-item${spanClass}" style="aspect-ratio:${ratio};--delay:${i * 30}ms" onclick="openLightbox('${escHtml(a.url)}', '${escHtml(a.alt || '')}')">
          <img src="${escHtml(a.url)}" alt="${escHtml(a.alt || '')}" loading="lazy">
        </div>`;
      }).join('');
    }

    function openLightbox(src, alt) {
      const lb = document.getElementById('feed-lightbox');
      const img = document.getElementById('feed-lightbox-img');
      img.src = src;
      img.alt = alt;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('feed-lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    init();
  </script>
</body>
</html>
