<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavel Panioukin — Design Leader</title>
  <meta name="description" content="Digital product designer and leader based in Krakow.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="site-header"></header>

  <main>

    <!-- Featured project hero -->
    <div id="featured-hero-wrap"></div>

    <!-- Remaining projects grid -->
    <div class="container" style="padding-top:0; padding-bottom:0;">
      <div class="project-grid" id="project-grid"></div>
    </div>

    <!-- CTA -->
    <section class="cta-section">
      <div class="container">
        <p class="cta-label">Get in Touch</p>
        <h2 class="cta-headline" id="cta-headline">Have a project in mind? Let's talk.</h2>
        <a class="cta-link" href="/contact.html">Say Hi →</a>
      </div>
    </section>

  </main>

  <footer id="site-footer"></footer>

  <!-- Project modal -->
  <div id="project-modal" class="modal-overlay" onclick="if(event.target===this)closeProject()">
    <div class="modal-panel">
      <button class="modal-close" onclick="closeProject()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="site.js"></script>
  <script>
    let projects = [];

    async function init() {
      const data = await fetch('data.json').then(r => r.json());
      projects = data.projects || [];
      renderFooterData(data);
      setText('cta-headline', (data.contact || {}).headline || 'Have a project in mind?');
      renderPage(projects);
    }

    function renderPage(items) {
      if (!items.length) return;

      // Featured = first project, full-width hero
      const featured = items[0];
      const thumbStyle = featured.thumbnail
        ? '' : `background:${featured.thumbnailGradient || '#ebebeb'}`;
      const thumbImg = featured.thumbnail
        ? `<img src="${escHtml(featured.thumbnail)}" alt="${escHtml(featured.title)}">`
        : '';
      document.getElementById('featured-hero-wrap').innerHTML = `
        <div class="featured-hero" onclick="openProject(projects, ${featured.id})" style="${thumbStyle}">
          ${thumbImg}
          <div class="featured-hero-overlay"></div>
          <div class="featured-hero-info">
            <div class="featured-hero-tag">Featured</div>
            <div class="featured-hero-title">${escHtml(featured.title)}</div>
            <div class="featured-hero-sub">${escHtml(featured.subtitle)}</div>
          </div>
        </div>`;

      // Remaining projects in 3-col grid
      const rest = items.slice(1);
      document.getElementById('project-grid').innerHTML =
        rest.map(p => buildProjectCard(p, `openProject(projects, ${p.id})`)).join('');
    }

    init();
  </script>
</body>
</html>
