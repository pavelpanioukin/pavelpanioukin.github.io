<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavel Panioukin — Product Designer</title>
  <meta name="description" content="Digital product designer and leader based in Krakow.">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="256x256" href="/assets/favicon-256.png">
  <link rel="stylesheet" href="main.css">
</head>
<body class="page-new">

  <div class="parallax-bg" aria-hidden="true"></div>

  <header id="site-header"></header>

  <main class="page-content">

    <!-- Stance -->
    <div class="homepage-stance container appear">
      <p class="homepage-body"><span style="display:block">I design for <span class="homepage-hi">the moment</span></span><span style="display:block">a person decides whether to <span class="homepage-hi">trust</span></span><span style="display:block">what's in front of them</span></p>
    </div>

  </main>

  <footer id="site-footer"></footer>

  <script src="site.js"></script>
  <script src="animations.js"></script>
  <script src="js/transitions.js"></script>
  <script src="/js/cursor.js"></script>
  <script>
  (function () {
    var bg = document.querySelector('.parallax-bg');
    if (!bg) return;
    var targetX = 50, targetY = 50, currentX = 50, currentY = 50;
    var lerp = 0.06;
    document.addEventListener('mousemove', function (e) {
      targetX = (e.clientX / window.innerWidth) * 100;
      targetY = (e.clientY / window.innerHeight) * 100;
    });
    function animate() {
      currentX += (targetX - currentX) * lerp;
      currentY += (targetY - currentY) * lerp;
      bg.style.background = 'radial-gradient(circle at ' + currentX + '% ' + currentY + '%, rgba(255, 255, 255, 0.03) 0%, transparent 60%)';
      requestAnimationFrame(animate);
    }
    animate();
  })();
  </script>
</body>
</html>
