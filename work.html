<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — Pavel Panioukin</title>
  <meta name="description" content="Selected design projects by Pavel Panioukin.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="page-header container">
      <h1 class="page-title">I design and lead teams building digital products from brief to final product.</h1>
    </div>

    <div class="work-grid-section container">
      <div class="project-grid" id="work-grid"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Project modal -->
  <div id="project-modal" class="modal-overlay" onclick="if(event.target===this)closeProject()">
    <div class="modal-panel">
      <button class="modal-close" onclick="closeProject()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="site.js"></script>
  <script src="animations.js"></script>
  <script>
    let projects = [];

    async function init() {
      const data = await fetch('data.json').then(r => r.json());
      projects = data.projects || [];
      renderFooterData(data);
      const grid = document.getElementById('work-grid');
      grid.innerHTML = projects
        .map(p => buildProjectCard(p, `openProject(projects, ${p.id})`))
        .join('');
    }

    init();
  </script>
</body>
</html>
