<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — Pavel Panioukin</title>
  <meta name="description" content="Selected design projects by Pavel Panioukin.">
  <meta property="og:title" content="Work — Pavel Panioukin">
  <meta property="og:description" content="Selected design projects by Pavel Panioukin.">
  <meta property="og:image" content="/assets/images/og-image.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="page-header container">
      <h1 class="page-title">I design and lead teams building digital products from brief to final product.</h1>
    </div>

    <div class="work-grid-section container">
      <div class="project-grid" id="work-grid"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="site.js"></script>
  <script src="animations.js"></script>
  <script>
    async function init() {
      const data = await fetch('data.json?v=' + Date.now()).then(r => r.json());
      renderFooterData(data);
      const grid = document.getElementById('work-grid');
      grid.innerHTML = (data.projects || [])
        .map(p => buildProjectCard(p))
        .join('');
    }

    init();
  </script>
</body>
</html>
